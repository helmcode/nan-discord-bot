name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Pytest
        shell: bash
        run: |
          set +e
          pytest
          status=$?
          # Exit 5 means "no tests collected" — accepted until the suite exists
          # (see CONTRIBUTING.md). Remove this exception once the first tests land.
          if [ $status -eq 5 ]; then
            echo "::warning::No tests collected. Per CONTRIBUTING.md, new PRs must ship with tests."
            exit 0
          fi
          exit $status
